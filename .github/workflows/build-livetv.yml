name: Build Live TV APK

# Builds the Live TV only app. Runs on every push to the livetv-only branch, or by hand
# from the Actions tab.
on:
  push:
    branches: [livetv-only]
  workflow_dispatch:

permissions:
  # Each build is published as a release, which the app's updater reads.
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Prepare properties
        env:
          LOCAL_PROPERTIES_BASE64: ${{ secrets.LOCAL_PROPERTIES_BASE64 }}
        run: |
          if [ -n "$LOCAL_PROPERTIES_BASE64" ]; then
            printf '%s' "$LOCAL_PROPERTIES_BASE64" | base64 --decode > local.properties
          else
            touch local.properties
          fi
          touch local.dev.properties

      # The fork's fixed key (keystore/livetv-fork.jks), so each build updates the last install.
      # To use your own key, add a secret LIVETV_KEYSTORE_BASE64 (passwords "livetvfork", alias "livetv").
      - name: Signing
        env:
          LIVETV_KEYSTORE_BASE64: ${{ secrets.LIVETV_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$LIVETV_KEYSTORE_BASE64" ]; then
            printf '%s' "$LIVETV_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/key.jks"
          else
            cp keystore/livetv-fork.jks "$RUNNER_TEMP/key.jks"
          fi
          {
            echo "NUVIO_RELEASE_STORE_FILE=$RUNNER_TEMP/key.jks"
            echo "NUVIO_RELEASE_KEY_ALIAS=livetv"
            echo "NUVIO_RELEASE_KEY_PASSWORD=livetvfork"
            echo "NUVIO_RELEASE_STORE_PASSWORD=livetvfork"
          } >> "$GITHUB_ENV"

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace \
            -PlivetvBuildNumber=${{ github.run_number }} \
            -PlivetvVersionName=1.0.${{ github.run_number }}

      - name: Collect APKs
        run: |
          mkdir -p out
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} out/ \;
          ls -la out

      - name: Check APKs
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for f in out/*.apk; do
            echo "===== $f"
            "$BT/aapt2" dump badging "$f" | grep -E "^package|sdkVersion|native-code|application-label:|testOnly|debuggable" || true
            "$BT/zipalign" -c -P 16 -v 4 "$f" | tail -1 || true
            "$BT/apksigner" verify --print-certs -v "$f" | grep -E "Verified|Signer #1 certificate SHA-256|DOES NOT|ERROR|WARNING" | head -12 || true
            unzip -l "$f" | grep -E "lib/.*\.so" | awk '{s+=$1} END {print "native libs bytes:", s}'
          done

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: livetv-only-apks
          path: out/*.apk
          if-no-files-found: error

      # The app checks GitHub's latest release ("build-N") and updates itself from it.
      - name: Publish release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          N=${{ github.run_number }}
          gh release create "build-$N" out/*.apk \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Live TV 1.0.$N" \
            --notes "$(git log -1 --pretty=%B)" \
            --latest
          # Keep only the last 3 releases (each holds about 120 MB of APKs).
          gh release list --repo "$GITHUB_REPOSITORY" --limit 100 --json tagName --jq '.[].tagName' \
            | grep '^build-' | sort -t- -k2 -n -r | tail -n +4 \
            | while read tag; do gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag; done
